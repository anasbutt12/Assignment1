    <header class="hero">

        <h1>Project Portfolio</h1>
        <p>A look at Bole machines working in factories around the world.</p>
    </header>

    <main>
        <section class="gallery">
            <figure class="item item-wide">
                <img src="images/eks-series.jpg" alt="Row of Bole EKS series machines in an automotive parts plant">
                <figcaption>
                    <h2>Automotive Parts Line</h2>
                    <p>Eight EKS series machines moulding dashboard clips and door trims.</p>
                </figcaption>
            </figure>

            <figure class="item">
                <img src="images/fe-series.jpg" alt="Bole FE series electric machine making medical parts">
                <figcaption>
                    <h2>Medical Clean Room</h2>
                    <p>All-electric FE series for syringe and test tube parts.</p>
                </figcaption>
            </figure>

            <figure class="item">
                <img src="images/fe-series.jpg" alt="Bole machine producing household containers">
                <figcaption>
                    <h2>Household Containers</h2>
                    <p>Thin-wall food boxes with fast cycle times.</p>
                </figcaption>
            </figure>

            <figure class="item item-tall">
                <img src="images/eks-series.jpg" alt="Large clamping unit of a Bole machine moulding crates">
                <figcaption>
                    <h2>Logistics Crates</h2>
                    <p>High clamping force for heavy-duty stackable crates.</p>
                </figcaption>
            </figure>

            <figure class="item">
                <img src="images/eks-series.jpg" alt="Bole machine making electronic housings">
                <figcaption>
                    <h2>Electronics Housings</h2>
                    <p>Precise shot control for phone charger cases.</p>
                </figcaption>
            </figure>

            <figure class="item">
                <img src="images/fe-series.jpg" alt="Bole machine moulding PET preforms for bottles">
                <figcaption>
                    <h2>PET Preforms</h2>
                    <p>Multi-cavity moulds for drinks bottle preforms.</p>
                </figcaption>
